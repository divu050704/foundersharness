<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>foundersharness Dev Helper Test Client</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h1 {
            margin-top: 0;
            color: #6366f1;
            font-size: 24px;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            padding: 10px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-dot.connected {
            background-color: #22c55e;
        }
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .panel-card {
            background-color: #334155;
            padding: 15px;
            border-radius: 8px;
        }
        .panel-card h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 16px;
            color: #94a3b8;
        }
        button {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        button:hover {
            background-color: #4f46e5;
        }
        button.secondary {
            background-color: #475569;
        }
        button.secondary:hover {
            background-color: #334155;
        }
        button.danger {
            background-color: #ef4444;
        }
        button.danger:hover {
            background-color: #dc2626;
        }
        input[type="text"] {
            width: calc(100% - 24px);
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #1e293b;
            color: white;
            margin-bottom: 10px;
        }
        .output-row {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .log-container, .screenshot-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .console {
            background-color: #0f172a;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            padding: 15px;
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            border: 1px solid #334155;
            color: #a7f3d0;
        }
        .screenshot-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .screenshot-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .placeholder-text {
            color: #475569;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>foundersharness Tray Helper Test Client</h1>
    
    <div class="status-bar">
        <div>
            <span id="statusDot" class="status-dot"></span>
            Status: <span id="statusText">Disconnected</span>
        </div>
        <div>
            <button id="btnConnect" onclick="connect()">Connect to Helper</button>
            <button id="btnDisconnect" class="secondary" onclick="disconnect()" style="display:none;">Disconnect</button>
        </div>
    </div>

    <div class="control-panel">
        <div class="panel-card">
            <h3>Browser Lifecycle</h3>
            <button onclick="sendAction('launch')">Launch Browser</button>
            <button class="danger" onclick="sendAction('close')">Close Browser</button>
            <button class="secondary" onclick="sendAction('new_page')">New Tab</button>
            <button class="secondary" onclick="sendAction('close_page')">Close Tab</button>
            <button class="secondary" onclick="sendAction('active_pages')">List Tabs</button>
        </div>
        
        <div class="panel-card">
            <h3>Automation Commands</h3>
            <input type="text" id="txtUrl" value="https://news.ycombinator.com" placeholder="Enter URL">
            <button onclick="navigate()">Navigate</button>
            
            <div style="margin-top: 10px;">
                <input type="text" id="txtSelector" value="a.hnuser" placeholder="CSS Selector (e.g. input[name=q])">
                <button onclick="readText()">Read Text</button>
                <button class="secondary" onclick="clickElement()">Click</button>
            </div>
        </div>
    </div>

    <div style="text-align: center; margin-bottom: 10px;">
        <button style="background-color: #0d9488; font-size: 15px; padding: 12px 25px;" onclick="takeScreenshot()">📷 Capture Screenshot</button>
    </div>

    <div class="output-row">
        <div class="log-container">
            <h3>Console Logs</h3>
            <div id="logConsole" class="console">Logs will appear here...</div>
        </div>
        
        <div class="screenshot-container">
            <h3>Latest Screenshot</h3>
            <div class="screenshot-box" id="screenshotBox">
                <span class="placeholder-text" id="screenshotPlaceholder">No screenshot captured yet</span>
                <img id="imgScreenshot" style="display:none;" alt="Browser Screenshot">
            </div>
        </div>
    </div>
</div>

<script>
    let ws;
    
    function log(message, type = 'info') {
        const consoleEl = document.getElementById('logConsole');
        if (consoleEl.innerHTML === 'Logs will appear here...') {
            consoleEl.innerHTML = '';
        }
        const time = new Date().toLocaleTimeString();
        consoleEl.innerHTML += `[${time}] [${type.toUpperCase()}] ${message}\n`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function connect() {
        log('Connecting to ws://localhost:9000/...');
        ws = new WebSocket('ws://localhost:9000/');

        ws.onopen = () => {
            document.getElementById('statusDot').className = 'status-dot connected';
            document.getElementById('statusText').innerText = 'Connected to Helper';
            document.getElementById('btnConnect').style.display = 'none';
            document.getElementById('btnDisconnect').style.display = 'inline-block';
            log('WebSocket connection established!', 'success');
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            log(`Received response for ID: ${response.id}`, 'response');
            
            if (response.status === 'error') {
                log(`Error: ${response.message}`, 'error');
            } else {
                if (response.result && response.result.length > 500) {
                    // Truncate base64 or long html in log
                    log(`Success: [Payload of length ${response.result.length} characters]`, 'success');
                } else {
                    log(`Success: ${JSON.stringify(response.result)}`, 'success');
                }

                // If screenshot, display it
                if (response.id.startsWith('scr_')) {
                    displayScreenshot(response.result);
                }
            }
        };

        ws.onclose = () => {
            document.getElementById('statusDot').className = 'status-dot';
            document.getElementById('statusText').innerText = 'Disconnected';
            document.getElementById('btnConnect').style.display = 'inline-block';
            document.getElementById('btnDisconnect').style.display = 'none';
            log('WebSocket connection closed.', 'warning');
        };

        ws.onerror = (error) => {
            log(`WebSocket Error. Ensure the C# Helper is running and server is started.`, 'error');
        };
    }

    function disconnect() {
        if (ws) {
            ws.close();
        }
    }

    function sendAction(action, params = {}) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            log('Cannot send command. WebSocket is not connected.', 'error');
            return;
        }

        const msgId = action + '_' + Math.random().toString(36).substr(2, 5);
        const payload = {
            id: msgId,
            action: action,
            ...params
        };

        log(`Sending command: ${action} (ID: ${msgId})...`, 'command');
        ws.send(JSON.stringify(payload));
    }

    function navigate() {
        const url = document.getElementById('txtUrl').value;
        sendAction('navigate', { url: url });
    }

    function readText() {
        const selector = document.getElementById('txtSelector').value;
        sendAction('get_text', { selector: selector });
    }

    function clickElement() {
        const selector = document.getElementById('txtSelector').value;
        sendAction('click', { selector: selector });
    }

    function takeScreenshot() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            log('Cannot send command. WebSocket is not connected.', 'error');
            return;
        }
        const msgId = 'scr_' + Math.random().toString(36).substr(2, 5);
        const payload = {
            id: msgId,
            action: 'screenshot'
        };
        log(`Requesting screenshot (ID: ${msgId})...`, 'command');
        ws.send(JSON.stringify(payload));
    }

    function displayScreenshot(base64Png) {
        const placeholder = document.getElementById('screenshotPlaceholder');
        const img = document.getElementById('imgScreenshot');
        
        placeholder.style.display = 'none';
        img.src = 'data:image/png;base64,' + base64Png;
        img.style.display = 'block';
        log('Screenshot displayed!', 'success');
    }
</script>

</body>
</html>
